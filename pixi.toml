[workspace]
authors = ["Allen Guo <guosonglin001@gmail.com>"]
channels = ["conda-forge"]
name = "triton"
platforms = ["linux-aarch64", "linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[system-requirements]
cuda = "12.9"

[dependencies]
# python = "3.13.*"
python = "3.12.*"
uv = ">=0.8.13,<0.9"

setuptools = ">=80.9.0,<81"
pytest = ">=9.0.2,<10"

pybind11 = ">=2.13.6,<3"
pybind11-global = ">=2.13.6,<3"
nlohmann_json = ">=3.12.0,<4"
zlib = ">=1.3.1,<2"

[target.osx-arm64.dependencies]
# cpu version with osx https://anaconda.org/conda-forge/pytorch
pytorch = "2.8.*"

# optional
boost = ">=1.85.0,<2"
llvm-openmp = ">=21.1.8,<22"

[target.linux-64.dependencies]
cusparselt = ">=0.8.0.4,<0.9"
# pixi add cuda-version=12.9 cuda-toolkit=12.9.1 -p linux-64
cuda-version = "12.9.*"
cuda-toolkit = "12.9.1.*"
# pixi add pytorch-gpu=2.8.0 -p linux-64
pytorch-gpu = "2.8.0.*"
sysroot_linux-64 = ">=2.28,<3"

[target.linux-64.pypi-dependencies]
typing-extensions = ">=4.15.0, <5"
llnl-hatchet = ">=2025.1.0, <2026"
# install with uv for bad network, use `--no-deps` in cuda env
# uv pip install "torch==2.8.0+cu129" "torchaudio==2.8.0+cu129" "torchvision==0.23.0+cu129" -f https://mirrors.aliyun.com/pytorch-wheels/cu129/ --no-deps
# uv pip install "torch==2.8.0+cu129" "torchaudio==2.8.0+cu129" "torchvision==0.23.0+cu129" -i https://download.pytorch.org/whl/cu129/ --no-deps
# uv pip install "torch==2.8.0+cu129" "torchaudio==2.8.0+cu129" "torchvision==0.23.0+cu129" -i https://mirror.sjtu.edu.cn/pytorch-wheels/cu129/ --no-deps
# torch = { version = "==2.8.0+cu129", index = "https://download.pytorch.org/whl/cu129" }

[activation.env]
# needs llvm-triton
PATH = "${PIXI_PROJECT_ROOT}/build/bin:${PIXI_PROJECT_ROOT}/llvm-triton/llvm-project/build/bin:${PATH}"
# only needed on macos
# CMAKE_PREFIX_PATH = "${CONDA_PREFIX}"
