[workspace]
authors = ["Allen Guo <guosonglin001@gmail.com>"]
channels = ["conda-forge"]
name = "triton"
platforms = ["linux-aarch64"]
version = "0.1.0"

[pypi-options]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tasks]

[dependencies]
python = "==3.13"
pytorch = ">=2.7.1,<3"
zlib = ">=1.3.1,<2"
pybind11 = ">=3.0.1,<4"
uv = ">=0.8.13,<0.9"

[activation]
# needs llvm-triton
env = { PATH = "${PWD}/llvm-triton/llvm-project/build/bin:${PATH}" }
